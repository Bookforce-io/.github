name: 📝 Propuesta
description: Cambio que requiere decisión antes de implementarse (se escribe en docs/propuestas/).
title: "Propuesta: "
labels: ["tipo: propuesta"]
body:
  - type: markdown
    attributes:
      value: |
        La propuesta se escribe en el repositorio como `docs/propuestas/NNNN-titulo.md` (o en
        `propuestas/` del paraguas del proyecto si abarca varios repos), se agrega al índice
        `README.md` de esa carpeta y entra por PR. Este issue es para la discusión y la decisión.
  - type: input
    id: propuesta
    attributes:
      label: Archivo de la propuesta
      placeholder: https://github.com/Bookforce-io/<repo>/blob/<rama>/docs/propuestas/0001-titulo.md
    validations:
      required: true
  - type: textarea
    id: resumen
    attributes:
      label: Resumen
      description: Problema y propuesta en 3–5 líneas.
    validations:
      required: true
  - type: input
    id: decision
    attributes:
      label: Quién decide y para cuándo
      placeholder: "@persona — AAAA-MM-DD"
    validations:
      required: true
